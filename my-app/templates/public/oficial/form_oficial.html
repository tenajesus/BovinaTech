{% extends 'public/base_cpanel.html' %}
<!--Cambiando el title-->
Registrar Salida Oficial
<!---->
{% block customCSS %}
<link
  rel="stylesheet"
  href="{{ url_for('static', filename ='assets/css/file.css') }}" />
{% endblock %}

<!--Inicio del block-->
{% block body %}
<div class="card" style="border-radius: 0px !important">
  

  <div class="row justify-content-center mb-2">
    <div class="col-md-10">
      <form
        class="form-horizontal mx-auto"
        method="POST"
        action="/form-registrar-oficial"
        autocomplete="off"
        enctype="multipart/form-data">
        <div class="card-body">
          <div class="row">
            <div class="col-md-4">
              <label for="fecha_solicitud" class="form-label">
                Fecha de Solicitud
              </label>
              <input
                type="date"
                name="fecha_solicitud"
                class="form-control"
                required />
            </div>
            <div class="col-md-4">
              <label for="medio_solicitud" class="form-label">
                Medio de Solicitud
              </label>
              <select
                class="form-select"
                name="medio_solicitud"
                aria-label="Default select example">
                <option selected>Seleccione</option>
                <option value="Oficio de Comision">Oficio de Comisión</option>
                <option value="Memorándum">Memorándum</option>
                <option value="Verbal">Verbal</option>
              </select>
            </div>
            <div class="col-md-4">
              <label for="num_documento" class="form-label">
                Número de Documento
              </label>
              <input
                type="text"
                name="num_documento"
                class="form-control"
                required />
            </div>
          </div>
          <div class="row justify-content-center mb-2">
            <div class="col-md-12">
              <div class="text-center mt-5 mb-3 alert alert-dark" role="alert">
                Datos de la Comisión
              </div>
              <hr />
            </div>
          </div>
          <div class="row mt-2">
            <div class="col-md-6">
              <label for="fecha_inicial" class="form-label">
                Fecha Inicial
              </label>
              <input 
              type="date"
              class="form-control"
              name="fecha_inicial"
              required>
            </div>
            <div class="col-md-6">
              <label for="fecha_final" class="form-label">
                Fecha Inicial
              </label>
              <input 
              type="date"
              class="form-control"
              name="fecha_final"
              required>
            </div>
            </div>
          </div>
          <div class="row mt-2">
            <div class="col-md-12">
              <label for="descripcion_com" class="form-label">
                Descripción de la Comisión
              </label>
              <textarea
                class="form-control"
                rows="4"
                name="descripcion_com"
                required>
                </textarea>
            </div>
            
          </div>
          <div class="row mt-2">
            <div class="col-md-6">
              <label for="lugar_comision" class="form-label">
                Lugar de la Comisión
              </label>
              <input
                class="form-control"
                type="text"
                name="lugar_comision"
                required />
            </div>
            <div class="col-md-6">
              <label for="area" class="form-label">
                Area de Adscripción
              </label>
              <select
                class="form-select"
                name="area"
                aria-label="Default select example">
                <option selected>Seleccione</option>
                <option value="Secretaría Académica">Secretaría Académica</option>
                <option value="Dirección de Administración y Finanzas">Dirección de Administración y Finanzas</option>
                <option value="Contraloría Interna">Contraloría Interna</option>
                <option value="Dirección de Vinculación">Dirección de Vinculación</option>
                <option value="Subdirección Jurídica">Subdirección Jurídica</option>
                <option value="Jefatura de Planeación y Sistema de Gestión de Calidad, ambiental y Sustentabilidad">Jefatura de Planeación y Sistema de Gestión de Calidad, ambiental y Sustentabilidad</option>
                <option value="Subdirección de Recursos Humanos">Subdirección de Recursos Humanos</option>
                <option value="Jefatura de Recursos Materiales">Jefatura de Recursos Materiales</option>
                <option value="Jefatura de Recursos Humanos">Jefatura de Recursos Humanos</option>
                <option value="Jefatura de Activo Fijo e Inventarios">Jefatura de Activo Fijo e Inventarios</option>
                <option value="Jefatura de Servicios Generales">Jefatura de Servicios Generales</option>
                <option value="Jefatura de Soporte Técnico">Jefatura de Soporte Técnico</option>
                <option value="Dirección de DN, ADM">Dirección de DN, ADM</option>
                <option value="Dirección de MIN, ASP">Dirección de MIN, ASP</option>
                <option value="Dirección de TF">Dirección de TF</option>
                <option value="Dirección de TI, MT, ER">Dirección de TI, MT, ER</option>
                <option value="Dirección de MI, PI">Dirección de MI, PI</option>
                <option value="Subdirección de Servicios Escolares">Subdirección de Servicios Escolares</option>
                <option value="Jefatura de la Unidad Académica de Pinos">Jefatura de la Unidad Académica de Pinos</option>
                <option value="Jefatura de Centro de Idiomas, Movilidad y Emprendimiento">Jefatura de Centro de Idiomas, Movilidad y Emprendimiento</option>
                <option value="Jefatura de Capacitación y Actualización Docente">Jefatura de Capacitación y Actualización Docente</option>
              </select>
     
          </div>
          <div class="row mt-2">
            
            <div class="col-md-6">
              <label for="comisionado" class="form-label">
                Comisionado
              </label>
              <input
                class="form-control"
                type="text"
                name="comisionado"
                id="comisionado"
                required />
            </div>
            <div class="col-md-6">
              <label for="licencia" class="form-label">
                N° de Licencia
              </label>
              <input
                class="form-control"
                type="text"
                name="licencia"
                id="licencia"
                required />
            </div>
            
          </div>
          <!-- Carga del archivo -->
           <div class="col-md-6">
              <label for="" class="form-label">
                Cargar imagen del Documento
              </label>
            </div>
          <div class="row mt-2">
            <div class="avatar-upload">
                <div>
                  <input
                    type="file"
                    name="foto_empleado"
                    id="imageUpload"
                    accept=".png, .jpg, .jpeg" />
                </div>
                <!-- <div class="avatar-preview">
                  <div class="avatar-preview">
                    {% set url_avatar= url_for('static', filename
                    ='assets/img/avatar.png') %}
                    <div
                      id="imagePreview"
                      style="background-image: url('{{ url_avatar }}')"></div>
                  </div>
                </div> -->
              </div>
          </div>
          <div class="row justify-content-center mb-2">
            <div class="col-md-12">
              <div class="text-center mt-5 mb-3 alert alert-danger" role="alert">
                Datos del Vehículo
              </div>
              <hr />
            </div>
          </div>
          <div class="row mt-2">
            <div class="col-md-5">
              <label for="km_inicial" class="form-label">
                Kilometraje Inicial
              </label>
              <input
                class="form-control"
                type="number"
                name="km_inicial"
                id="km_inicial"
                required
                 />
            </div>
            <div class="col-md-5">
              <label for="km_final" class="form-label">
                Kilometraje Final
              </label>
              <input
                class="form-control"
                type="number"
                name="km_final"
                id="km_final"
                required 
                onblur="suma()"/>
            </div>
            <div class="col-md-2">
              <label for="total_recorrido" class="form-label">
                Total Recorrido
              </label>
              <input
                class="form-control"
                type="number"
                name="total_recorrido"
                id="total_recorrido"
                 />
            </div>
          </div>
          <div class="row mt-2">
            <div class="col-md-4">
              <label for="Fecha_carga" class="form-label">
                Fecha de Carga
              </label>
              <input
                class="form-control"
                type="date"
                name="fecha_carga"
                required />
            </div>
            <div class="col-md-4">
              <label for="importe_cargado" class="form-label">
                Importe cargado
              </label>
              <input
                class="form-control"
                type="number"
                name="importe_cargado"
                id="importe_cargado"
                required />
            </div>
            <div class="col-md-4">
              <label for="folioticket" class="form-label">
                Folio Ticket
              </label>
              <input
                class="form-control"
                type="text"
                name="folioticket"
                id="folioticket"
                required />
            </div>
          </div>
          <div class="row mt-2">
            <div class="col-md-4">
              <label for="litros_ticket" class="form-label">
                Litros Ticket
              </label>
              <input
                class="form-control"
                type="text"
                name="litros_ticket"
                required />
            </div>
            <div class="col-md-4">
              <label for="rendimiento" class="form-label">
                Rendimiento
              </label>
              <input
                class="form-control"
                type="text"
                name="rendimiento"
                id="rendimiento"
                required />
            </div>
            <div class="col-md-4">
              <label for="precio_compra" class="form-label">
                Precio de Compra
              </label>
              <input
                class="form-control"
                type="text"
                name="precio_compra"
                id="precio_compra"
                required />
            </div>
          </div>
          <div class="row mt-2">
            <div class="col-md-6">
              <label for="total_consumo" class="form-label">
                Total Consumido
              </label>
              <input
                class="form-control"
                type="text"
                name="total_consumo"
                required />
            </div>
            <div class="col-md-6">
              <label for="num_eco" class="form-label">
                Vehículo
              </label>
              <select
                class="form-select"
                name="num_eco"
                aria-label="Default select example">
                <option selected>Seleccione</option>
                <option value="Tiida Sedan">Tiida Sedan</option>
                <option value="Sentra Premium">Sentra Premium</option>
                <option value="Express Van">Express Van</option>
                <option value="Ranger">Ranger</option>
                <option value="Tiida Sedan Drive">Tiida Sedan Drive</option>
                <option value="Autobus Blue Bird">Autobus Blue Bird</option>
                <option value="Seltos">Seltos</option>
                <option value="Rio">Rio</option>
              </select>
            </div>
          </div>
          <div class="row mt-2">
            <div class="col-md-12">
              <label for="observa" class="form-label">
                Observaciones
              </label>
              <input
                class="form-control"
                type="text"
                name="observa"
                required />
            </div>
          </div>
          <div class="mb-3 mt-4 text-center">
            <button type="submit" class="btn btn-primary">
              Guardar registro
              <i class="bi bi-database-add"></i>
            </button>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %} {% block customJS %}http://localhost:5600/lista-de-usuarios
<script src="{{ url_for('static', filename ='assets/customJS/file.js') }}"></script>
<script>
  function suma(){
    
    var total = 0;
    var inicial = 0;
    var final = 0;	
    inicial = document.getElementById('km_inicial').value;
    final = document.getElementById('km_final').value;
    total = (parseInt(final) - parseInt(inicial));
    document.getElementById('total_recorrido').value = total;
  }
</script>
{% endblock %}
