<!-- Modal para Registrar Salida de Elemento -->
<div class="modal fade" id="modalSalida" tabindex="-1" aria-labelledby="modalSalidaLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header bg-success text-white">
                <h5 class="modal-title" id="modalSalidaLabel">
                    <i class="bx bx-arrow-from-bottom"></i> Registrar Salida de Elemento
                </h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                    aria-label="Close"></button>
            </div>
            <form id="formSalida" method="POST" action="/inventario/registrar-salida">
                <div class="modal-body">
                    <input type="hidden" id="salida_id_item" name="id_item">
                    <input type="hidden" id="salida_tipo" name="tipo_elemento">

                    <!-- Información del Elemento -->
                    <div class="alert alert-info">
                        <strong>Elemento:</strong> <span id="salida_nombre_elemento"></span><br>
                        <strong>Tipo:</strong> <span id="salida_tipo_elemento"></span><br>
                        <strong>Stock Actual:</strong> <span id="salida_stock_actual"></span>
                    </div>

                    <!-- Campos Comunes -->
                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="salida_cantidad" class="form-label">Cantidad a Retirar *</label>
                                <input type="number" step="0.01" class="form-control" id="salida_cantidad"
                                    name="cantidad" required min="0.01">
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="salida_fecha" class="form-label">Fecha de Salida *</label>
                                <input type="date" class="form-control" id="salida_fecha" name="fecha" required>
                            </div>
                        </div>
                    </div>

                    <!-- Campos para MEDICAMENTO -->
                    <div id="camposMedicamentoSalida" style="display: none;">
                        <hr>
                        <h6 class="text-success">Salida de Medicamento</h6>
                        <p class="text-muted small">
                            <i class="bx bx-info-circle"></i>
                            Si el medicamento se aplicó a un animal, regístralo en <strong>Registro Sanitario</strong>
                        </p>

                        <div class="row">
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="salida_motivo_medicamento" class="form-label">Motivo de Salida *</label>
                                    <select class="form-select" id="salida_motivo_medicamento" name="motivo">
                                        <option value="">Seleccionar...</option>
                                        <option value="venta">Venta</option>
                                        <option value="caducado">Caducado/Vencido</option>
                                    </select>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="salida_responsable_med" class="form-label">Responsable</label>
                                    <input type="text" class="form-control" id="salida_responsable_med"
                                        name="responsable" placeholder="Nombre del responsable">
                                </div>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="salida_observaciones_med" class="form-label">Observaciones</label>
                            <textarea class="form-control" id="salida_observaciones_med" name="observaciones" rows="2"
                                placeholder="Detalles adicionales (cliente, motivo de caducidad, etc.)"></textarea>
                        </div>
                    </div>

                    <!-- Campos para ALIMENTO -->
                    <div id="camposAlimentoSalida" style="display: none;">
                        <hr>
                        <h6 class="text-success">Salida de Alimento</h6>
                        <p class="text-muted small">
                            <i class="bx bx-info-circle"></i>
                            Si el alimento se dio al ganado, regístralo en <strong>Registro de Alimentación</strong>
                        </p>

                        <div class="row">
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="salida_motivo_alimento" class="form-label">Motivo de Salida *</label>
                                    <select class="form-select" id="salida_motivo_alimento" name="motivo">
                                        <option value="">Seleccionar...</option>
                                        <option value="venta">Venta</option>
                                        <option value="desperdicio_merma">Desperdicio/Merma</option>
                                    </select>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="salida_responsable_alim" class="form-label">Responsable</label>
                                    <input type="text" class="form-control" id="salida_responsable_alim"
                                        name="responsable" placeholder="Nombre">
                                </div>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="salida_observaciones_alim" class="form-label">Observaciones</label>
                            <textarea class="form-control" id="salida_observaciones_alim" name="observaciones" rows="2"
                                placeholder="Detalles (cliente, causa de merma, etc.)"></textarea>
                        </div>
                    </div>

                    <!-- Campos para HERRAMIENTA -->
                    <div id="camposHerramientaSalida" style="display: none;">
                        <hr>
                        <h6 class="text-success">Uso de Herramienta</h6>

                        <div class="row">
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="salida_motivo_herramienta" class="form-label">Motivo de Uso *</label>
                                    <select class="form-select" id="salida_motivo_herramienta" name="motivo">
                                        <option value="">Seleccionar...</option>
                                        <option value="uso_interno">Uso Interno</option>
                                        <option value="prestamo">Préstamo</option>
                                        <option value="venta">Venta</option>
                                        <option value="perdida">Pérdida/Robo</option>
                                        <option value="dano">Daño/Desecho</option>
                                    </select>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="salida_responsable_herr"
                                        class="form-label">Responsable/Destinatario</label>
                                    <input type="text" class="form-control" id="salida_responsable_herr"
                                        name="responsable" placeholder="Nombre">
                                </div>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="salida_observaciones_herr" class="form-label">Observaciones</label>
                            <textarea class="form-control" id="salida_observaciones_herr" name="observaciones" rows="2"
                                placeholder="Detalles del uso..."></textarea>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-success">
                        <i class="bx bx-check"></i> Registrar Salida
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    // Función para registrar salida (abre modal inteligente)
    async function registrarSalida(id_item, tipo, nombre) {
        try {
            // Obtener datos actuales del elemento
            const response = await fetch(`/api/inventario/${id_item}`);
            const item = await response.json();

            // Llenar información básica
            document.getElementById('salida_id_item').value = id_item;
            document.getElementById('salida_tipo').value = tipo;
            document.getElementById('salida_nombre_elemento').textContent = nombre;
            document.getElementById('salida_tipo_elemento').textContent = tipo.charAt(0).toUpperCase() + tipo.slice(1);
            document.getElementById('salida_stock_actual').textContent = `${item.cantidad} ${item.unidad_medida}`;

            // Establecer fecha actual
            const hoy = new Date().toISOString().split('T')[0];
            document.getElementById('salida_fecha').value = hoy;

            // Establecer cantidad máxima
            document.getElementById('salida_cantidad').max = item.cantidad;

            // Mostrar/ocultar campos según el tipo y gestionar atributos required
            const divMed = document.getElementById('camposMedicamentoSalida');
            const divAlim = document.getElementById('camposAlimentoSalida');
            const divHerr = document.getElementById('camposHerramientaSalida');

            // Resetear display
            divMed.style.display = 'none';
            divAlim.style.display = 'none';
            divHerr.style.display = 'none';

            // Resetear required
            document.getElementById('salida_motivo_medicamento').required = false;
            document.getElementById('salida_motivo_alimento').required = false;
            document.getElementById('salida_motivo_herramienta').required = false;

            if (tipo === 'medicamento') {
                divMed.style.display = 'block';
                document.getElementById('salida_motivo_medicamento').required = true;
            } else if (tipo === 'alimento') {
                divAlim.style.display = 'block';
                document.getElementById('salida_motivo_alimento').required = true;
            } else if (tipo === 'herramienta') {
                divHerr.style.display = 'block';
                document.getElementById('salida_motivo_herramienta').required = true;
            }

            // Mostrar modal
            const modal = new bootstrap.Modal(document.getElementById('modalSalida'));
            modal.show();
        } catch (error) {
            console.error('Error al preparar salida:', error);
            alert('Error al cargar los datos del elemento');
        }
    }

    // Limpiar formulario al cerrar modal
    document.getElementById('modalSalida').addEventListener('hidden.bs.modal', function () {
        document.getElementById('formSalida').reset();
    });
</script>
